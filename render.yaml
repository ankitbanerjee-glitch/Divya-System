services:
  - type: web
    name: divya-system
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEVICE_API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
