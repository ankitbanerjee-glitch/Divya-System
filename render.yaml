services:
  - type: web
    name: divya-grid-console
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: divya_system
      - key: DIVYA_ADMIN_USER
        sync: false
      - key: DIVYA_ADMIN_PASSWORD
        sync: false
      - key: DIVYA_USER_USER
        sync: false
      - key: DIVYA_USER_PASSWORD
        sync: false
